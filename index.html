<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BSN PREP SINDH · AI</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- THEME TOKENS (DARK default) ---------- */
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-raised: #1a1a24;
      --border: rgba(255, 255, 255, 0.06);
      --border-soft: rgba(255, 255, 255, 0.1);
      --text-primary: #f2f2f7;
      --text-secondary: #9a9aa8;
      --text-tertiary: #5e5e6e;
      --accent-glow: rgba(120, 140, 255, 0.25);
      --accent: #6b7aff;
      --accent-soft: #3d4270;
      --user-bubble: #1e1e2e;
      --ai-bubble: #16161f;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* ---------- LIGHT THEME ---------- */
    [data-theme="light"] {
      --bg: #f7f7fc;
      --surface: #ffffff;
      --surface-raised: #f0f0f6;
      --border: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0, 0, 0, 0.08);
      --text-primary: #111118;
      --text-secondary: #5a5a6e;
      --text-tertiary: #8e8e9e;
      --accent-glow: rgba(100, 115, 255, 0.15);
      --accent: #5b6aff;
      --accent-soft: #d6d9ff;
      --user-bubble: #e8eaff;
      --ai-bubble: #ffffff;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.4s ease, color 0.3s ease;
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
    }

    /* ---------- APP CONTAINER ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
    }

    /* ---------- BRAND & THEME TOGGLE ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 8px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .brand:hover {
      opacity: 1;
    }

    .theme-toggle {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 40px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      font-size: 1.2rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover {
      background: var(--surface);
      border-color: var(--border-soft);
      color: var(--text-primary);
    }

    /* ---------- AVATAR SECTION (centerpiece) ---------- */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 0 auto;
      min-height: 0;
      padding: 8px 0 0;
      transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Soft glowing effect */
    .avatar-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
      filter: blur(20px);
      animation: pulseGlow 4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .avatar-ring {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255, 255, 255, 0.02);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    /* AI profile — elegant, modern, abstract */
    .avatar-core {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a3a, #15151f);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] .avatar-core {
      background: linear-gradient(145deg, #ffffff, #e8e8f0);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    /* Minimal geometric neural pattern */
    .avatar-core::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 1.5px solid rgba(107, 122, 255, 0.5);
      animation: rotateSlow 12s linear infinite;
    }

    .avatar-core::after {
      content: '';
      position: absolute;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 1px solid rgba(107, 122, 255, 0.3);
      animation: rotateSlow 8s linear infinite reverse;
    }

    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Inner dot / eye */
    .avatar-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent), 0 0 32px rgba(107, 122, 255, 0.4);
      animation: pulseDot 2.5s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    /* Brand name under avatar */
    .brand-name {
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-align: center;
      transition: all 0.4s ease;
      opacity: 0.95;
    }

    /* ---------- CHAT AREA ---------- */
    .chat-area {
      flex: 0 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      opacity: 0;
      transition: opacity 0.4s ease;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-soft) transparent;
    }

    .chat-area.visible {
      opacity: 1;
    }

    .chat-area::-webkit-scrollbar {
      width: 4px;
    }

    .chat-area::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-area::-webkit-scrollbar-thumb {
      background: var(--accent-soft);
      border-radius: 10px;
    }

    /* Message bubbles */
    .message {
      max-width: 85%;
      padding: 14px 20px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.55;
      word-break: break-word;
      animation: fadeSlide 0.3s ease forwards;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.3s, border-color 0.3s;
      opacity: 0;
      transform: translateY(8px);
    }

    @keyframes fadeSlide {
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: var(--radius-sm);
      color: var(--text-primary);
      border-color: transparent;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-bottom-left-radius: var(--radius-sm);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .message.ai .ai-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      opacity: 0.8;
    }

    /* ---------- INPUT BAR (bottom) ---------- */
    .input-bar {
      flex-shrink: 0;
      padding: 8px 0 24px;
      width: 100%;
      background: transparent;
      transition: padding 0.3s;
      z-index: 10;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 4px 4px 4px 20px;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .input-container:focus-within {
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 8px 14px 0;
      font-size: 1rem;
      color: var(--text-primary);
      min-width: 0;
      letter-spacing: -0.01em;
      font-weight: 400;
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(107, 122, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:hover {
      background: #7b88ff;
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(107, 122, 255, 0.5);
    }

    .send-btn:active {
      transform: scale(0.96);
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.2s;
    }

    .send-btn:hover svg {
      transform: translateX(2px);
    }

    /* ---------- RESPONSIVE / MOBILE FIRST ---------- */
    @media (min-width: 480px) {
      .app { padding: 0 24px; }
      .avatar-wrapper { width: 140px; height: 140px; }
      .brand-name { font-size: 1.7rem; }
      .message { max-width: 75%; }
    }

    @media (min-width: 768px) {
      .app { padding: 0 32px; }
      .avatar-wrapper { width: 160px; height: 160px; }
      .brand-name { font-size: 2rem; }
      .message { max-width: 65%; }
      .input-bar { padding: 12px 0 32px; }
    }

    /* When chat is active (avatar shrinks) */
    .app.chat-active .avatar-section {
      flex: 0 0 auto;
      padding: 4px 0 0;
    }

    .app.chat-active .avatar-wrapper {
      width: 64px;
      height: 64px;
    }

    .app.chat-active .brand-name {
      font-size: 1.1rem;
      margin-top: 10px;
    }

    .app.chat-active .avatar-glow {
      inset: -6px;
      filter: blur(12px);
    }

    /* Smooth transition for avatar size */
    .avatar-wrapper,
    .brand-name,
    .avatar-section {
      transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Hide scroll on avatar when chatting */
    .app.chat-active .chat-area {
      flex: 1 1 auto;
    }

    /* Utility */
    .hidden {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- TOP BAR: brand + theme -->
    <div class="top-bar">
      <div class="brand">BSN PREP SINDH</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <!-- AVATAR SECTION (centerpiece) -->
    <div class="avatar-section" id="avatarSection">
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-ring">
          <div class="avatar-core">
            <div class="avatar-dot"></div>
          </div>
        </div>
      </div>
      <div class="brand-name">BSN PREP SINDH</div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea">
      <!-- Messages injected here -->
    </div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <div class="input-container">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="Ask anything…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message input"
        />
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.4 20.4L20.85 12.92C21.66 12.57 21.66 11.43 20.85 11.08L3.4 3.6C2.74 3.31 2.01 3.83 2.01 4.55L2 9.12C2 9.64 2.39 10.08 2.9 10.14L15 12L2.9 13.86C2.39 13.92 2 14.36 2 14.88L2.01 19.45C2.01 20.17 2.74 20.69 3.4 20.4Z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM refs ----------
      const app = document.getElementById('app');
      const avatarSection = document.getElementById('avatarSection');
      const chatArea = document.getElementById('chatArea');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');

      // ---------- State ----------
      let isChatActive = false;
      let messages = []; // { role: 'user' | 'ai', text: string }

      // ---------- Theme handling ----------
      const getPreferredTheme = () => {
        const stored = localStorage.getItem('bsn-theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      };

      const setTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('bsn-theme', theme);
      };

      // Init theme
      setTheme(getPreferredTheme());

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });

      // ---------- Chat activation (shrink avatar) ----------
      const activateChat = () => {
        if (!isChatActive) {
          isChatActive = true;
          app.classList.add('chat-active');
          chatArea.classList.add('visible');
        }
      };

      // ---------- Render messages ----------
      const renderMessages = () => {
        chatArea.innerHTML = '';
        messages.forEach((msg) => {
          const el = document.createElement('div');
          el.classList.add('message', msg.role);
          if (msg.role === 'ai') {
            const tag = document.createElement('div');
            tag.classList.add('ai-tag');
            tag.textContent = 'BSN AI';
            el.appendChild(tag);
          }
          const textNode = document.createElement('div');
          textNode.textContent = msg.text;
          el.appendChild(textNode);
          chatArea.appendChild(el);
        });
        // Scroll to bottom
        requestAnimationFrame(() => {
          chatArea.scrollTop = chatArea.scrollHeight;
        });
      };

      // ---------- Add message ----------
      const addMessage = (role, text) => {
        messages.push({ role, text });
        renderMessages();
        activateChat();
      };

      // ---------- Handle send ----------
      const handleSend = () => {
        const text = chatInput.value.trim();
        if (!text) return;

        // Add user message
        addMessage('user', text);
        chatInput.value = '';
        chatInput.focus();

        // Simulate AI response (minimal, professional)
        setTimeout(() => {
          const aiResponses = [
            "I'm here to help with your BSN prep. What topic would you like to explore?",
            "That's a great question. Let's break it down step by step.",
            "I understand. Could you share more details so I can assist better?",
            "Focus on understanding core concepts. I can guide you through them.",
            "Let's review that together. What specific area needs clarification?",
          ];
          const randomReply = aiResponses[Math.floor(Math.random() * aiResponses.length)];
          addMessage('ai', randomReply);
        }, 600);
      };

      sendBtn.addEventListener('click', handleSend);

      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // ---------- Initial focus (optional, subtle) ----------
      // Keep focus on input after load for quick typing
      window.addEventListener('load', () => {
        chatInput.focus({ preventScroll: true });
      });

      // ---------- Responsive: ensure chat area scroll works ----------
      // No extra logic needed; flex handles it.

      // ---------- Prevent zoom on double-tap (mobile) ----------
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });

    })();
  </script>
</body>
</html>
