<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BSN PREP SINDH · AI</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- THEME TOKENS ---------- */
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-raised: #1a1a24;
      --border: rgba(255, 255, 255, 0.06);
      --border-soft: rgba(255, 255, 255, 0.1);
      --text-primary: #f2f2f7;
      --text-secondary: #9a9aa8;
      --text-tertiary: #5e5e6e;
      --accent-glow: rgba(120, 140, 255, 0.25);
      --accent: #6b7aff;
      --accent-soft: #3d4270;
      --user-bubble: #1e1e2e;
      --ai-bubble: #16161f;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
      --radius-lg: 20px;
      --radius-sm: 14px;
      --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    [data-theme="light"] {
      --bg: #f7f7fc;
      --surface: #ffffff;
      --surface-raised: #f0f0f6;
      --border: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0, 0, 0, 0.08);
      --text-primary: #111118;
      --text-secondary: #5a5a6e;
      --text-tertiary: #8e8e9e;
      --accent-glow: rgba(100, 115, 255, 0.15);
      --accent: #5b6aff;
      --accent-soft: #d6d9ff;
      --user-bubble: #e8eaff;
      --ai-bubble: #ffffff;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.4s ease, color 0.3s ease;
    }

    /* ---------- APP CONTAINER ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ---------- TOP BAR (initial screen only) ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      flex-shrink: 0;
      z-index: 10;
      transition: opacity 0.3s ease, height 0.3s ease, padding 0.3s ease;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .theme-toggle {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 40px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      font-size: 1.2rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover {
      background: var(--surface);
      border-color: var(--border-soft);
      color: var(--text-primary);
    }

    /* ---------- INITIAL (HERO) SCREEN ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      min-height: 0;
      padding: 8px 20px;
      position: relative;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
      filter: blur(20px);
      animation: pulseGlow 4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .avatar-ring {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255, 255, 255, 0.02);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .avatar-core {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a3a, #15151f);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] .avatar-core {
      background: linear-gradient(145deg, #ffffff, #e8e8f0);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .avatar-core::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 1.5px solid rgba(107, 122, 255, 0.5);
      animation: rotateSlow 12s linear infinite;
    }

    .avatar-core::after {
      content: '';
      position: absolute;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 1px solid rgba(107, 122, 255, 0.3);
      animation: rotateSlow 8s linear infinite reverse;
    }

    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent), 0 0 32px rgba(107, 122, 255, 0.4);
      animation: pulseDot 2.5s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .brand-name {
      margin-top: 22px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-align: center;
      opacity: 0.95;
    }

    /* ---------- CHAT AREA (full screen when active) ---------- */
    .chat-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px 8px;
      display: none;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-soft) transparent;
    }

    .chat-area.visible {
      display: flex;
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb {
      background: var(--accent-soft);
      border-radius: 10px;
    }

    /* ---------- MESSAGES ---------- */
    .message {
      max-width: 92%;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.55;
      word-break: break-word;
      animation: fadeSlide 0.3s ease forwards;
      border: 1px solid var(--border);
      opacity: 0;
      transform: translateY(8px);
      position: relative;
    }

    @keyframes fadeSlide {
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 6px;
      color: var(--text-primary);
      border-color: transparent;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-bottom-left-radius: 6px;
      color: var(--text-primary);
      border-color: var(--border);
      padding-bottom: 34px; /* room for copy button */
    }

    .message.ai .ai-tag {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
      opacity: 0.85;
    }

    /* ---------- COPY BUTTON ---------- */
    .copy-btn {
      position: absolute;
      bottom: 8px;
      right: 12px;
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 4px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition);
      opacity: 0.75;
      -webkit-tap-highlight-color: transparent;
    }

    .copy-btn:hover {
      background: var(--surface-raised);
      color: var(--text-primary);
      opacity: 1;
      border-color: var(--accent-soft);
    }

    .copy-btn.copied {
      color: var(--accent);
      border-color: var(--accent-soft);
    }

    /* ---------- INPUT BAR ---------- */
    .input-bar {
      flex-shrink: 0;
      padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      background: var(--bg);
      transition: padding 0.3s;
      z-index: 10;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 4px 4px 4px 20px;
      transition: var(--transition);
      box-shadow: var(--shadow);
      max-width: 900px;
      margin: 0 auto;
    }

    .input-container:focus-within {
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 8px 14px 0;
      font-size: 1rem;
      color: var(--text-primary);
      min-width: 0;
      letter-spacing: -0.01em;
      font-weight: 400;
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(107, 122, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:hover {
      background: #7b88ff;
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(107, 122, 255, 0.5);
    }

    .send-btn:active { transform: scale(0.96); }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      transition: transform 0.2s;
    }

    .send-btn:hover:not(:disabled) svg { transform: translateX(2px); }

    /* ---------- CHAT MODE (hide hero + topbar) ---------- */
    .app.chat-active .top-bar {
      display: none;
    }

    .app.chat-active .hero {
      display: none;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (min-width: 480px) {
      .avatar-wrapper { width: 150px; height: 150px; }
      .brand-name { font-size: 1.9rem; }
      .message { max-width: 80%; }
      .chat-area { padding: 20px 24px 8px; }
    }

    @media (min-width: 768px) {
      .avatar-wrapper { width: 170px; height: 170px; }
      .brand-name { font-size: 2.2rem; }
      .message { max-width: 72%; }
      .chat-area { padding: 24px 32px 8px; }
      .input-bar { padding: 12px 32px calc(20px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (min-width: 1024px) {
      .message { max-width: 65%; }
      .chat-area { padding: 28px 40px 8px; }
    }

    /* iOS keyboard fix */
    @supports (-webkit-touch-callout: none) {
      .app { height: -webkit-fill-available; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- TOP BAR (initial only) -->
    <div class="top-bar" id="topBar">
      <div class="brand">BSN PREP SINDH</div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button>
    </div>

    <!-- HERO (initial only) -->
    <div class="hero" id="hero">
      <div class="avatar-wrapper">
        <div class="avatar-glow"></div>
        <div class="avatar-ring">
          <div class="avatar-core">
            <div class="avatar-dot"></div>
          </div>
        </div>
      </div>
      <div class="brand-name">BSN PREP SINDH</div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea"></div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <div class="input-container">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="Ask anything…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message input"
        />
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.4 20.4L20.85 12.92C21.66 12.57 21.66 11.43 20.85 11.08L3.4 3.6C2.74 3.31 2.01 3.83 2.01 4.55L2 9.12C2 9.64 2.39 10.08 2.9 10.14L15 12L2.9 13.86C2.39 13.92 2 14.36 2 14.88L2.01 19.45C2.01 20.17 2.74 20.69 3.4 20.4Z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM refs ----------
      const app = document.getElementById('app');
      const chatArea = document.getElementById('chatArea');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');

      // ---------- Config ----------
      const BASE_URL = 'https://bsn-prep-sindh-production.up.railway.app';
      const API = BASE_URL + '/api/chat';
      const HEALTH = BASE_URL + '/api/health';
      const REQUEST_TIMEOUT_MS = 60000;

      let conversation = [];
      let messages = [];
      let isChatActive = false;
      let isSending = false;

      // ---------- Theme ----------
      const getPreferredTheme = () => {
        const stored = localStorage.getItem('bsn-theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      };

      const setTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('bsn-theme', theme);
      };

      setTheme(getPreferredTheme());

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });

      // ---------- Chat activation ----------
      const activateChat = () => {
        if (!isChatActive) {
          isChatActive = true;
          app.classList.add('chat-active');
          chatArea.classList.add('visible');
        }
      };

      // ---------- Copy button ----------
      const createCopyButton = (text) => {
        const btn = document.createElement('button');
        btn.className = 'copy-btn';
        btn.type = 'button';
        btn.textContent = 'Copy';
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(text);
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.classList.remove('copied');
            }, 1500);
          } catch {
            // Fallback for older browsers
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch {}
            document.body.removeChild(ta);
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = 'Copy';
              btn.classList.remove('copied');
            }, 1500);
          }
        });
        return btn;
      };

      // ---------- Render ----------
      const renderMessages = () => {
        chatArea.innerHTML = '';
        messages.forEach((msg) => {
          const el = document.createElement('div');
          el.classList.add('message', msg.role);

          if (msg.role === 'ai') {
            const tag = document.createElement('div');
            tag.classList.add('ai-tag');
            tag.textContent = 'BSN AI';
            el.appendChild(tag);

            const textNode = document.createElement('div');
            textNode.textContent = msg.text;
            el.appendChild(textNode);

            // Copy button only for real AI replies (not Thinking... / error)
            if (
              msg.text &&
              msg.text !== 'Thinking...' &&
              !msg.text.startsWith('AI service temporarily unavailable') &&
              !msg.text.startsWith('Request timed out')
            ) {
              el.appendChild(createCopyButton(msg.text));
            }
          } else {
            const textNode = document.createElement('div');
            textNode.textContent = msg.text;
            el.appendChild(textNode);
          }

          chatArea.appendChild(el);
        });
        requestAnimationFrame(() => {
          chatArea.scrollTop = chatArea.scrollHeight;
        });
      };

      const addMessage = (role, text) => {
        messages.push({ role, text });
        renderMessages();
        activateChat();
      };

      // ---------- Health check ----------
      const checkHealth = async () => {
        try {
          const r = await fetch(HEALTH, { method: 'GET' });
          if (r.ok) console.log('✅ Backend live');
          else console.warn('⚠️ Backend health:', r.status);
        } catch {
          console.warn('⚠️ Backend unreachable');
        }
      };
      checkHealth();

      // ---------- Handle send ----------
      const handleSend = async () => {
        if (isSending) return;

        const text = chatInput.value.trim();
        if (!text) return;

        isSending = true;
        sendBtn.disabled = true;

        addMessage('user', text);
        chatInput.value = '';
        chatInput.focus();

        const previousConversation = conversation.slice(-12);
        conversation.push({ role: 'user', content: text });

        addMessage('ai', 'Thinking...');
        const thinkingIndex = messages.length - 1;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
          const response = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              conversation: previousConversation,
              languageInstruction:
                'Student jis zaban mein sawal kare, jawab usi zaban mein dein. English sawal ka jawab English mein, Urdu sawal ka jawab Urdu mein, aur Roman Urdu sawal ka jawab Roman Urdu mein dein. Agar student mixed language use kare to naturally usi style mein jawab dein. Zaban khud se change na karein.'
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          let data;
          try {
            data = await response.json();
          } catch {
            throw new Error('Invalid response from server');
          }

          if (!response.ok) {
            throw new Error(data?.reply || ('HTTP ' + response.status));
          }

          const reply = data.reply || 'No response received.';
          messages[thinkingIndex].text = reply;
          conversation.push({ role: 'assistant', content: reply });
          renderMessages();

        } catch (error) {
          clearTimeout(timeoutId);

          if (conversation.length && conversation[conversation.length - 1].role === 'user') {
            conversation.pop();
          }

          const msg = (error && error.name === 'AbortError')
            ? 'Request timed out. Please try again.'
            : 'AI service temporarily unavailable. Please try again.';

          messages[thinkingIndex].text = msg;
          renderMessages();

        } finally {
          isSending = false;
          sendBtn.disabled = false;
        }
      };

      sendBtn.addEventListener('click', handleSend);

      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // ---------- Initial focus ----------
      window.addEventListener('load', () => {
        chatInput.focus({ preventScroll: true });
      });

      // ---------- Prevent double-tap zoom (mobile) ----------
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      // ---------- Keep composer visible when keyboard opens (mobile) ----------
      if (window.visualViewport) {
        const vv = window.visualViewport;
        const onViewportChange = () => {
          // When chat is active and keyboard is open, keep composer near bottom
          if (isChatActive) {
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        };
        vv.addEventListener('resize', onViewportChange);
        vv.addEventListener('scroll', onViewportChange);
      }

    })();
  </script>
</body>
</html>
