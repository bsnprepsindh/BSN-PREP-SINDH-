<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BSN PREP SINDH · AI</title>
  <style>
    /* ---------- RESET & GLOBAL ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------- THEME TOKENS ---------- */
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-raised: #1a1a24;
      --border: rgba(255, 255, 255, 0.06);
      --border-soft: rgba(255, 255, 255, 0.1);
      --text-primary: #f2f2f7;
      --text-secondary: #9a9aa8;
      --text-tertiary: #5e5e6e;
      --accent-glow: rgba(120, 140, 255, 0.25);
      --accent: #6b7aff;
      --accent-soft: #3d4270;
      --user-bubble: #1e1e2e;
      --ai-bubble: #16161f;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.8);
      --radius-lg: 20px;
      --radius-sm: 14px;
      --transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    [data-theme="light"] {
      --bg: #f7f7fc;
      --surface: #ffffff;
      --surface-raised: #f0f0f6;
      --border: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0, 0, 0, 0.08);
      --text-primary: #111118;
      --text-secondary: #5a5a6e;
      --text-tertiary: #8e8e9e;
      --accent-glow: rgba(100, 115, 255, 0.15);
      --accent: #5b6aff;
      --accent-soft: #d6d9ff;
      --user-bubble: #e8eaff;
      --ai-bubble: #ffffff;
      --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.12);
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      transition: background 0.4s ease, color 0.3s ease;
    }

    /* ---------- APP CONTAINER ---------- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
      position: relative;
      overflow: hidden;
    }

    /* ---------- TOP BAR (initial screen only) ---------- */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 8px;
      flex-shrink: 0;
      z-index: 10;
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      opacity: 0.8;
    }

    .theme-toggle {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 40px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: var(--transition);
      font-size: 1.2rem;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-toggle:hover {
      background: var(--surface);
      border-color: var(--border-soft);
      color: var(--text-primary);
    }

    /* ---------- BSN PREP SINDH LOGO ---------- */
    .bsn-logo {
      width: 112px; height: 112px; border-radius: 32px;
      display:flex; align-items:center; justify-content:center;
      position:relative;
      background: linear-gradient(145deg, #1d2348, #0e1020);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: 0 18px 45px rgba(72,84,255,.28), inset 0 1px 0 rgba(255,255,255,.12);
    }
    .bsn-logo::before {
      content:''; position:absolute; inset:10px; border-radius:25px;
      border:1px solid rgba(125,140,255,.35);
    }
    .bsn-cross {
      width:48px; height:48px; position:relative;
      filter: drop-shadow(0 0 12px rgba(120,140,255,.5));
    }
    .bsn-cross::before,.bsn-cross::after {
      content:''; position:absolute; left:15px; top:4px; width:18px; height:40px;
      border-radius:5px; background:linear-gradient(180deg,#aab4ff,#6474ff);
    }
    .bsn-cross::after { transform:rotate(90deg); }
    .logo-title { margin-top:20px; font-size:1.55rem; font-weight:800; letter-spacing:-.04em; }
    .logo-subtitle { margin-top:7px; color:var(--text-secondary); font-size:.82rem; letter-spacing:.12em; text-transform:uppercase; }

    /* ---------- INITIAL (HERO) SCREEN ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
      min-height: 0;
      padding: 8px 20px;
      position: relative;
    }

    .avatar-wrapper {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
      filter: blur(20px);
      animation: pulseGlow 4s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.04); }
    }

    .avatar-ring {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--surface);
      border: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(255, 255, 255, 0.02);
    }

    .avatar-core {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      background: linear-gradient(145deg, #2a2a3a, #15151f);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] .avatar-core {
      background: linear-gradient(145deg, #ffffff, #e8e8f0);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .avatar-core::before {
      content: '';
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 1.5px solid rgba(107, 122, 255, 0.5);
      animation: rotateSlow 12s linear infinite;
    }

    .avatar-core::after {
      content: '';
      position: absolute;
      width: 50%;
      height: 50%;
      border-radius: 50%;
      border: 1px solid rgba(107, 122, 255, 0.3);
      animation: rotateSlow 8s linear infinite reverse;
    }

    @keyframes rotateSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .avatar-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px var(--accent), 0 0 32px rgba(107, 122, 255, 0.4);
      animation: pulseDot 2.5s infinite ease-in-out;
      z-index: 2;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .brand-name {
      margin-top: 22px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      text-align: center;
      opacity: 0.95;
    }

    /* ---------- CHAT AREA (hidden until active) ---------- */
    .chat-area {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 16px 8px;
      display: none;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-soft) transparent;
    }

    .chat-area.visible {
      display: flex;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb {
      background: var(--accent-soft);
      border-radius: 10px;
    }


    .app.chat-active .top-bar,
    .app.chat-active .hero { display:none; }
    .app.chat-active .chat-area { display:flex; }
    .app.chat-active .input-bar { margin-top:auto; }

    /* ---------- MESSAGES ---------- */
    .message {
      max-width: 92%;
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeSlide 0.3s ease forwards;
      border: 1px solid var(--border);
      opacity: 0;
      transform: translateY(8px);
      position: relative;
    }

    @keyframes fadeSlide {
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: var(--user-bubble);
      border-bottom-right-radius: 6px;
      color: var(--text-primary);
      border-color: transparent;
      white-space: pre-wrap;
    }

    .message.ai {
      align-self: flex-start;
      background: var(--ai-bubble);
      border-bottom-left-radius: 6px;
      color: var(--text-primary);
      border-color: var(--border);
      max-width: 96%;
      width: 100%;
      padding-bottom: 14px;
    }

    .message.ai .ai-tag {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      opacity: 0.85;
    }

    /* ---------- AI CONTENT (Markdown-rendered) ---------- */
    .ai-content {
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-primary);
    }

    .ai-content p {
      margin: 0 0 12px 0;
    }

    .ai-content p:last-child {
      margin-bottom: 0;
    }

    .ai-content h1,
    .ai-content h2,
    .ai-content h3,
    .ai-content h4 {
      font-weight: 700;
      color: var(--text-primary);
      margin: 18px 0 10px 0;
      line-height: 1.3;
    }

    .ai-content h1 { font-size: 1.2rem; }
    .ai-content h2 { font-size: 1.1rem; }
    .ai-content h3 { font-size: 1.02rem; }
    .ai-content h4 { font-size: 0.98rem; }

    .ai-content h1:first-child,
    .ai-content h2:first-child,
    .ai-content h3:first-child,
    .ai-content h4:first-child {
      margin-top: 0;
    }

    .ai-content strong,
    .ai-content b {
      font-weight: 700;
      color: var(--text-primary);
    }

    .ai-content em,
    .ai-content i {
      font-style: italic;
    }

    .ai-content ul,
    .ai-content ol {
      margin: 10px 0 14px 0;
      padding-left: 22px;
    }

    .ai-content li {
      margin-bottom: 8px;
      line-height: 1.6;
      padding-left: 4px;
    }

    .ai-content li:last-child {
      margin-bottom: 0;
    }

    .ai-content ul li::marker {
      color: var(--accent);
    }

    .ai-content ol li::marker {
      color: var(--accent);
      font-weight: 600;
    }

    .ai-content code {
      background: var(--surface-raised);
      border: 1px solid var(--border-soft);
      border-radius: 6px;
      padding: 2px 6px;
      font-family: 'SF Mono', Menlo, Consolas, monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .ai-content pre {
      background: var(--surface-raised);
      border: 1px solid var(--border-soft);
      border-radius: 10px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 12px 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .ai-content pre code {
      background: transparent;
      border: none;
      padding: 0;
      color: var(--text-primary);
    }

    .ai-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin: 12px 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    .ai-content hr {
      border: none;
      border-top: 1px solid var(--border-soft);
      margin: 16px 0;
    }

    .ai-content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .ai-content a:hover {
      border-bottom-color: var(--accent);
    }

    /* ---------- COPY BUTTON ---------- */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      background: transparent;
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      font-family: inherit;
      padding: 6px 12px;
      cursor: pointer;
      transition: var(--transition);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      min-height: 30px;
    }

    .copy-btn:hover {
      background: var(--surface-raised);
      color: var(--text-primary);
      border-color: var(--accent-soft);
    }

    .copy-btn:active {
      transform: scale(0.97);
    }

    .copy-btn.copied {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-glow);
    }

    .copy-btn svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ---------- INPUT BAR ---------- */
    .top-actions{display:flex;align-items:center;gap:8px}
    .recent-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer}
    .recent-btn:hover{border-color:var(--accent);transform:translateY(-1px)}
    .recent-panel{position:fixed;top:70px;right:18px;width:min(360px,calc(100vw - 36px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.22);z-index:50;padding:14px;display:none}
    .recent-panel.open{display:block}
    .recent-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:10px}
    .recent-close{border:0;background:transparent;color:var(--text-secondary);font-size:20px;cursor:pointer}
    .recent-item{padding:11px 12px;border:1px solid var(--border);border-radius:12px;margin:7px 0;cursor:pointer;background:var(--surface-2)}
    .recent-item:hover{border-color:var(--accent)}
    .recent-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .recent-time{font-size:11px;color:var(--text-secondary);margin-top:4px}
    .recent-empty{color:var(--text-secondary);padding:16px 4px;text-align:center}
    .pdf-btn {
      width:42px; height:42px; flex:0 0 42px; border:1px solid var(--border-soft);
      border-radius:13px; background:var(--surface-raised); color:var(--text-primary);
      cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
      transition:var(--transition);
    }
    .pdf-btn:hover { transform:translateY(-1px); border-color:var(--accent); box-shadow:0 8px 22px var(--accent-glow); }

    .input-bar {
      flex-shrink: 0;
      padding: 8px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      background: var(--bg);
      z-index: 10;
    }

    .input-container {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 4px 4px 4px 20px;
      transition: var(--transition);
      box-shadow: var(--shadow);
      max-width: 900px;
      margin: 0 auto;
    }

    .input-container:focus-within {
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 4px var(--accent-glow), var(--shadow);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 14px 8px 14px 0;
      font-size: 1rem;
      color: var(--text-primary);
      min-width: 0;
      font-weight: 400;
      font-family: inherit;
    }

    .chat-input::placeholder {
      color: var(--text-tertiary);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #fff;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(107, 122, 255, 0.3);
      -webkit-tap-highlight-color: transparent;
    }

    .send-btn:hover {
      background: #7b88ff;
      transform: scale(1.02);
    }

    .send-btn:active { transform: scale(0.96); }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ---------- CHAT MODE: HIDE EVERYTHING ELSE ---------- */
    .app.chat-active .top-bar {
      display: none !important;
    }

    .app.chat-active .hero {
      display: none !important;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (min-width: 480px) {
      .avatar-wrapper { width: 150px; height: 150px; }
      .brand-name { font-size: 1.9rem; }
      .chat-area { padding: 20px 20px 8px; gap: 18px; }
      .message.ai { max-width: 92%; }
    }

    @media (min-width: 768px) {
      .avatar-wrapper { width: 170px; height: 170px; }
      .brand-name { font-size: 2.2rem; }
      .chat-area { padding: 24px 32px 8px; gap: 20px; }
      .message { max-width: 80%; }
      .message.ai { max-width: 82%; }
      .pdf-btn {
      width:42px; height:42px; flex:0 0 42px; border:1px solid var(--border-soft);
      border-radius:13px; background:var(--surface-raised); color:var(--text-primary);
      cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
      transition:var(--transition);
    }
    .pdf-btn:hover { transform:translateY(-1px); border-color:var(--accent); box-shadow:0 8px 22px var(--accent-glow); }

    .input-bar { padding: 12px 32px calc(20px + env(safe-area-inset-bottom, 0px)); }
    }

    /* iOS keyboard fix */
    @supports (-webkit-touch-callout: none) {
      .app { height: -webkit-fill-available; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- TOP BAR (initial only) -->
    <div class="top-bar" id="topBar">
      <div class="brand">BSN PREP SINDH</div>
      <div class="top-actions"><button class="recent-btn" id="recentBtn" type="button">🕘 Recent</button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeIcon">🌙</span>
      </button></div>
    </div>

    <div class="recent-panel" id="recentPanel">
      <div class="recent-head"><span>Recent Chats</span><button class="recent-close" id="recentClose" type="button">×</button></div>
      <div id="recentList"></div>
    </div>

    <!-- HERO (initial only) -->
    <div class="hero" id="hero">
      <div class="bsn-logo" aria-label="BSN PREP SINDH logo">
        <div class="bsn-cross"></div>
      </div>
      <div class="logo-title">BSN PREP SINDH</div>
      <div class="logo-subtitle">AI Nursing Entry Test Preparation</div>
    </div>

    <!-- CHAT AREA -->
    <div class="chat-area" id="chatArea"></div>

    <!-- INPUT BAR -->
    <div class="input-bar">
      <div class="input-container">
        <button class="pdf-btn" id="pdfBtn" type="button" aria-label="Make PDF" title="Make PDF">📄</button>
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="Ask anything…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Message input"
        />
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.4 20.4L20.85 12.92C21.66 12.57 21.66 11.43 20.85 11.08L3.4 3.6C2.74 3.31 2.01 3.83 2.01 4.55L2 9.12C2 9.64 2.39 10.08 2.9 10.14L15 12L2.9 13.86C2.39 13.92 2 14.36 2 14.88L2.01 19.45C2.01 20.17 2.74 20.69 3.4 20.4Z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- DOM refs ----------
      const app = document.getElementById('app');
      const chatArea = document.getElementById('chatArea');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const themeToggle = document.getElementById('themeToggle');
      const themeIcon = document.getElementById('themeIcon');
      const pdfBtn = document.getElementById('pdfBtn');
      const recentBtn = document.getElementById('recentBtn');
      const recentPanel = document.getElementById('recentPanel');
      const recentList = document.getElementById('recentList');
      const recentClose = document.getElementById('recentClose');

      // ---------- Config ----------
      // Netlify Functions: same-origin API (no Railway dependency)
      const API = '/api/chat';
      const HEALTH = '/api/chat';
      const REQUEST_TIMEOUT_MS = 60000;

      let conversation = [];
      let messages = [];
      let isChatActive = false;
      let isSending = false;

      // ============================================================
      // SAFE MARKDOWN RENDERER
      // Converts a limited, safe subset of Markdown to HTML.
      // All user/AI content is escaped FIRST, so no raw HTML injection.
      // ============================================================
      const escapeHtml = (str) => {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      };

      const renderInline = (text) => {
        // Escape first
        let s = escapeHtml(text);

        // Bold: **text** or __text__
        s = s.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
        s = s.replace(/__([^_\n]+?)__/g, '<strong>$1</strong>');

        // Italic: *text* or _text_ (avoid touching ** already replaced)
        s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
        s = s.replace(/(^|[^_])_([^_\n]+?)_(?!_)/g, '$1<em>$2</em>');

        // Inline code: `code`
        s = s.replace(/`([^`\n]+?)`/g, '<code>$1</code>');

        // Links: [text](url) — only allow http/https
        s = s.replace(/\[([^\]]+?)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

        return s;
      };

      const renderMarkdown = (raw) => {
        if (!raw) return '';

        // Normalize line endings
        let text = String(raw).replace(/\r\n/g, '\n');

        const lines = text.split('\n');
        const html = [];
        let listType = null; // 'ul' | 'ol' | null
        let paragraphBuffer = [];
        let inCodeBlock = false;
        let codeBuffer = [];

        const flushParagraph = () => {
          if (paragraphBuffer.length) {
            const joined = paragraphBuffer.join(' ').trim();
            if (joined) {
              html.push('<p>' + renderInline(joined) + '</p>');
            }
            paragraphBuffer = [];
          }
        };

        const closeList = () => {
          if (listType) {
            html.push('</' + listType + '>');
            listType = null;
          }
        };

        const flushCode = () => {
          if (codeBuffer.length) {
            html.push('<pre><code>' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>');
            codeBuffer = [];
          }
        };

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const trimmed = line.trim();

          // Code fences
          if (trimmed.startsWith('```')) {
            if (inCodeBlock) {
              flushCode();
              inCodeBlock = false;
            } else {
              flushParagraph();
              closeList();
              inCodeBlock = true;
            }
            continue;
          }

          if (inCodeBlock) {
            codeBuffer.push(line);
            continue;
          }

          // Blank line
          if (trimmed === '') {
            flushParagraph();
            closeList();
            continue;
          }

          // Horizontal rule
          if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
            flushParagraph();
            closeList();
            html.push('<hr />');
            continue;
          }

          // Headings (#, ##, ###, ####)
          const headingMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
          if (headingMatch) {
            flushParagraph();
            closeList();
            const level = headingMatch[1].length;
            html.push('<h' + level + '>' + renderInline(headingMatch[2]) + '</h' + level + '>');
            continue;
          }

          // Unordered list (-, *, +)
          const ulMatch = trimmed.match(/^[-*+]\s+(.*)$/);
          if (ulMatch) {
            flushParagraph();
            if (listType !== 'ul') {
              closeList();
              html.push('<ul>');
              listType = 'ul';
            }
            html.push('<li>' + renderInline(ulMatch[1]) + '</li>');
            continue;
          }

          // Ordered list (1. 2. etc.)
          const olMatch = trimmed.match(/^\d+\.\s+(.*)$/);
          if (olMatch) {
            flushParagraph();
            if (listType !== 'ol') {
              closeList();
              html.push('<ol>');
              listType = 'ol';
            }
            html.push('<li>' + renderInline(olMatch[1]) + '</li>');
            continue;
          }

          // Normal paragraph line
          closeList();
          paragraphBuffer.push(trimmed);
        }

        // Flush leftovers
        if (inCodeBlock) flushCode();
        flushParagraph();
        closeList();

        return html.join('');
      };

      // ============================================================
      // COPY BUTTON
      // ============================================================
      const copyTextToClipboard = async (text) => {
        // Modern API first
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (e) {
            // fall through to fallback
          }
        }
        // Fallback for Android WebView / older mobile browsers
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '0';
          ta.style.left = '0';
          ta.style.width = '2em';
          ta.style.height = '2em';
          ta.style.padding = '0';
          ta.style.border = 'none';
          ta.style.outline = 'none';
          ta.style.boxShadow = 'none';
          ta.style.background = 'transparent';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;
        } catch (e) {
          return false;
        }
      };

      const createCopyButton = (getText) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'copy-btn';
        btn.setAttribute('aria-label', 'Copy response');
        btn.innerHTML =
          '<svg viewBox="0 0 24 24" aria-hidden="true">' +
            '<rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>' +
            '<path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>' +
          '</svg>' +
          '<span>Copy</span>';

        let resetTimer = null;

        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();

          const text = getText();
          const ok = await copyTextToClipboard(text);

          const label = btn.querySelector('span');
          if (ok) {
            label.textContent = 'Copied ✓';
            btn.classList.add('copied');
          } else {
            label.textContent = 'Failed';
          }

          if (resetTimer) clearTimeout(resetTimer);
          resetTimer = setTimeout(() => {
            label.textContent = 'Copy';
            btn.classList.remove('copied');
          }, 1500);
        });

        return btn;
      };

      // ---------- Theme ----------
      const getPreferredTheme = () => {
        const stored = localStorage.getItem('bsn-theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      };

      const setTheme = (theme) => {
        document.documentElement.setAttribute('data-theme', theme);
        themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
        localStorage.setItem('bsn-theme', theme);
      };

      setTheme(getPreferredTheme());

      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        setTheme(current === 'dark' ? 'light' : 'dark');
      });

      // ---------- Chat activation ----------
      const activateChat = () => {
        isChatActive = true;
        app.classList.add('chat-active');
        chatArea.classList.add('visible');
      };

      // ---------- Render ----------
      const renderMessages = () => {
        chatArea.innerHTML = '';
        messages.forEach((msg) => {
          const el = document.createElement('div');
          el.classList.add('message', msg.role);

          if (msg.role === 'ai') {
            const tag = document.createElement('div');
            tag.classList.add('ai-tag');
            tag.textContent = 'BSN AI';
            el.appendChild(tag);

            const content = document.createElement('div');
            content.className = 'ai-content';

            // Special states: Thinking... / errors → plain text (no markdown)
            if (
              msg.text === 'Thinking...' ||
              msg.text.startsWith('AI service temporarily unavailable') ||
              msg.text.startsWith('Request timed out')
            ) {
              content.textContent = msg.text;
            } else {
              content.innerHTML = renderMarkdown(msg.text);
            }

            el.appendChild(content);

            // Copy button ONLY for real AI replies
            if (
              msg.text &&
              msg.text !== 'Thinking...' &&
              !msg.text.startsWith('AI service temporarily unavailable') &&
              !msg.text.startsWith('Request timed out')
            ) {
              const copyBtn = createCopyButton(() => msg.text);
              el.appendChild(copyBtn);
            }
          } else {
            const textNode = document.createElement('div');
            textNode.textContent = msg.text;
            el.appendChild(textNode);
          }

          chatArea.appendChild(el);
        });

        requestAnimationFrame(() => {
          chatArea.scrollTop = chatArea.scrollHeight;
        });
      };

      const addMessage = (role, text) => {
        messages.push({ role, text });
        renderMessages();
        activateChat();
      };

      // ---------- Health check ----------
      const checkHealth = async () => {
        try {
          const r = await fetch(HEALTH, { method: 'GET' });
          if (r.ok) console.log('✅ Backend live');
          else console.warn('⚠️ Backend health:', r.status);
        } catch {
          console.warn('⚠️ Backend unreachable');
        }
      };
      checkHealth();

      const RECENT_KEY = 'bsn-recent-chats';
      let currentChatTitle = '';

      const loadRecent = () => {
        try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch { return []; }
      };
      const saveRecent = () => {
        if (!messages.length) return;
        const first = messages.find(m => m.role === 'user');
        if (!first) return;
        const items = loadRecent().filter(x => x.id !== currentChatTitle);
        const item = { id: currentChatTitle || Date.now().toString(), title: String(first.text).slice(0,70), messages, conversation, time: new Date().toLocaleString() };
        items.unshift(item);
        localStorage.setItem(RECENT_KEY, JSON.stringify(items.slice(0,20)));
        currentChatTitle = item.id;
      };
      const renderRecent = () => {
        const items = loadRecent();
        if (!items.length) { recentList.innerHTML = '<div class="recent-empty">Abhi koi recent chat nahi hai.</div>'; return; }
        recentList.innerHTML = items.map((x,i) => `<div class="recent-item" data-index="${i}"><div class="recent-title">${escapeHtml(x.title || 'Chat')}</div><div class="recent-time">${escapeHtml(x.time || '')}</div></div>`).join('');
        recentList.querySelectorAll('.recent-item').forEach(el => el.addEventListener('click', () => {
          const x = items[Number(el.dataset.index)];
          messages = Array.isArray(x.messages) ? x.messages : [];
          conversation = Array.isArray(x.conversation) ? x.conversation : [];
          isChatActive = true; app.classList.add('chat-active'); chatArea.classList.add('visible');
          renderMessages(); recentPanel.classList.remove('open');
        }));
      };
      recentBtn.addEventListener('click', () => { renderRecent(); recentPanel.classList.toggle('open'); });
      recentClose.addEventListener('click', () => recentPanel.classList.remove('open'));
      document.addEventListener('click', (e) => { if (!recentPanel.contains(e.target) && e.target !== recentBtn) recentPanel.classList.remove('open'); });

      // ---------- Handle send ----------
      const handleSend = async () => {
        if (isSending) return;

        const text = chatInput.value.trim();
        if (!text) return;

        isSending = true;
        sendBtn.disabled = true;

        addMessage('user', text);
        chatInput.value = '';
        chatInput.focus();

        const previousConversation = conversation.slice(-12);
        conversation.push({ role: 'user', content: text });

        addMessage('ai', 'Thinking...');
        const thinkingIndex = messages.length - 1;

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

        try {
          const response = await fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              message: text,
              conversation: previousConversation,
              languageInstruction:
                'Student jis zaban mein sawal kare, jawab usi zaban mein dein. English sawal ka jawab English mein, Urdu sawal ka jawab Urdu mein, aur Roman Urdu sawal ka jawab Roman Urdu mein dein. Agar student mixed language use kare to naturally usi style mein jawab dein. Zaban khud se change na karein.'
            }),
            signal: controller.signal
          });

          clearTimeout(timeoutId);

          let data;
          try {
            data = await response.json();
          } catch {
            throw new Error('Invalid response from server');
          }

          if (!response.ok) {
            throw new Error(data?.reply || ('HTTP ' + response.status));
          }

          const reply = data.reply || 'No response received.';
          messages[thinkingIndex].text = reply;
          conversation.push({ role: 'assistant', content: reply });
          saveRecent();
          renderMessages();

        } catch (error) {
          clearTimeout(timeoutId);

          if (conversation.length && conversation[conversation.length - 1].role === 'user') {
            conversation.pop();
          }

          const msg = (error && error.name === 'AbortError')
            ? 'Request timed out. Please try again.'
            : 'AI service temporarily unavailable. Please try again.';

          messages[thinkingIndex].text = msg;
          renderMessages();

        } finally {
          isSending = false;
          sendBtn.disabled = false;
        }
      };

      const makePdf = () => {
        if (!messages.length) { alert('Pehle AI se kuch notes ya answer banwa lein.'); return; }
        const rows = messages.map(m => {
          const role = m.role === 'user' ? 'Student' : 'BSN PREP SINDH AI';
          return `<div class="msg"><div class="role">${role}</div><div>${renderMarkdown(m.text)}</div></div>`;
        }).join('');
        const w = window.open('', '_blank');
        if (!w) { alert('PDF window open nahi hui. Browser popup allow karein.'); return; }
        w.document.write(`<!doctype html><html><head><title>BSN PREP SINDH Notes</title><style>body{font-family:Arial,sans-serif;padding:28px;color:#111;line-height:1.6}h1{font-size:24px;margin-bottom:4px}.sub{color:#666;margin-bottom:24px}.msg{margin:0 0 18px;padding:14px 16px;border:1px solid #ddd;border-radius:12px}.role{font-weight:700;margin-bottom:7px;color:#3949ab}p{margin:0 0 9px}h2,h3{margin:14px 0 7px}ul,ol{padding-left:24px}code{background:#f2f2f2;padding:2px 4px;border-radius:4px}</style></head><body><h1>BSN PREP SINDH</h1><div class="sub">AI Nursing Entry Test Preparation</div>${rows}<script>window.onload=()=>setTimeout(()=>window.print(),300)<\/script></body></html>`);
        w.document.close();
      };
      pdfBtn.addEventListener('click', makePdf);

      sendBtn.addEventListener('click', handleSend);

      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });

      // ---------- Initial focus ----------
      window.addEventListener('load', () => {
        chatInput.focus({ preventScroll: true });
      });

      // ---------- Prevent double-tap zoom (mobile) ----------
      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      // ---------- Keyboard handling (mobile) ----------
      if (window.visualViewport) {
        const vv = window.visualViewport;
        const onViewportChange = () => {
          if (isChatActive) {
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        };
        vv.addEventListener('resize', onViewportChange);
        vv.addEventListener('scroll', onViewportChange);
      }

    })();
  </script>
</body>
